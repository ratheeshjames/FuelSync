name: Android CI/CD - Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Job 1: Verification, Linting, & Unit Tests
  # -------------------------------------------------------------------
  test_and_verify:
    name: Unit Tests & Code Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest --continue --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-junit
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # -------------------------------------------------------------------
  # Job 2: Build Debug & Release Artifacts
  # -------------------------------------------------------------------
  build_artifacts:
    name: Build APKs & Release Bundle (AAB)
    needs: test_and_verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Release Keystore (Secrets Orchestration)
        id: keystore_setup
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${GITHUB_WORKSPACE}/app/release.keystore"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/app/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No RELEASE_KEYSTORE_BASE64 found in secrets. Using debug signing for CI validation..."
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Assemble Release APK & Android App Bundle (AAB)
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fuelsync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fuelsync-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: fuelsync-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
