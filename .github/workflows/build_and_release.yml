name: Android CI/CD - Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Job 1: Verification, Linting, & Unit Tests
  # -------------------------------------------------------------------
  test_and_verify:
    name: Unit Tests & Code Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean stale checked-in build outputs
        run: |
          rm -rf build app/build .gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-junit
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # -------------------------------------------------------------------
  # Job 2: Build Debug & Release Artifacts
  # -------------------------------------------------------------------
  build_artifacts:
    name: Build APKs & Release Bundle (AAB)
    needs: test_and_verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean stale checked-in build outputs
        run: |
          rm -rf build app/build .gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare Release Keystore
        id: keystore_setup
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${GITHUB_WORKSPACE}/release.keystore"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No secrets.RELEASE_KEYSTORE_BASE64 found. Generating CI release keystore for workflow validation..."
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/ci-release.keystore" \
              -alias upload -keyalg RSA -keysize 2048 -validity 1000 \
              -storepass ci_secret_password -keypass ci_secret_password \
              -dname "CN=CI, OU=Mobile, O=FuelSync, L=Mountain View, ST=CA, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/ci-release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=ci_secret_password" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ci_secret_password" >> $GITHUB_ENV
          fi

      - name: Assemble Release APK & Android App Bundle (AAB)
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fuelsync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fuelsync-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: fuelsync-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
